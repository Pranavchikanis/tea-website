services:
  db:
    image: postgres:15
    container_name: steepandsip_db
    restart: always
    environment:
      POSTGRES_DB: teastore_dev
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432" # Mapped to 5432 on host
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: steepandsip_app
    restart: always
    ports:
      - "80:8080" # Maps port 80 to Spring Boot's 8080
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/teastore_dev
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - db

volumes:
  db_data:
