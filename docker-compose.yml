services:
  db:
    image: mysql:8.0
    container_name: steepandsip_db
    restart: always
    environment:
      MYSQL_DATABASE: teastore_dev
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306" # Mapped to 3307 on host to avoid conflict with local MySQL if running
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: steepandsip_app
    restart: always
    ports:
      - "80:8080" # Maps port 80 to Spring Boot's 8080
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/teastore_dev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - db

volumes:
  db_data:
