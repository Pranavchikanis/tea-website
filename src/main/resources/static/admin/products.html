<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products | Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .admin-nav {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
            margin-bottom: 2rem;
        }
        .admin-nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-links a {
            margin-right: 1rem;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
        }
        .admin-links a:hover, .admin-links a.active {
            color: var(--primary-color);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--surface-color);
            box-shadow: var(--shadow-sm);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }
        tr:last-child td {
            border-bottom: none;
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: var(--surface-color);
            border-radius: 8px;
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="admin-nav">
        <div class="container">
            <div>
                <a href="/" style="font-weight: 700; text-decoration: none; color: inherit; margin-right: 2rem;">🌿 Storefront</a>
                <span class="admin-links">
                    <a href="/admin/index.html">Dashboard</a>
                    <a href="/admin/products.html" class="active">Products</a>
                </span>
            </div>
            <div>
                <a href="#" class="btn btn-outline" onclick="auth.logout(); return false;">Logout</a>
            </div>
        </div>
    </div>

    <div class="container" style="padding-bottom: 4rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h1>Manage Products</h1>
            <button class="btn btn-primary" id="btn-add-product">+ Add Product</button>
        </div>
        
        <div id="admin-alert" class="alert d-none"></div>

        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="product-list">
                    <tr><td colspan="7" style="text-align: center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Product Modal -->
    <div class="modal-overlay d-none" id="product-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">Add Product</h2>
                <button class="modal-close" id="btn-close-modal">&times;</button>
            </div>
            
            <form id="product-form">
                <input type="hidden" id="prod-id">
                
                <div class="form-group">
                    <label for="prod-name">Name</label>
                    <input type="text" id="prod-name" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="prod-desc">Description</label>
                    <textarea id="prod-desc" class="form-control" rows="3" required></textarea>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="prod-price">Price ($)</label>
                        <input type="number" step="0.01" id="prod-price" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="prod-stock">Stock Quantity</label>
                        <input type="number" id="prod-stock" class="form-control" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="prod-category">Category ID (1:Black, 2:Green, 3:Herbal, 4:Chai)</label>
                    <input type="number" id="prod-category" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="prod-image">Image URL</label>
                    <input type="text" id="prod-image" class="form-control" placeholder="/images/example.jpg">
                </div>
                
                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" id="prod-active" checked>
                        <span>Is Active</span>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Save Product</button>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/admin-products.js"></script>
</body>
</html>
